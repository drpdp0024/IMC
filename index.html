<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Monitoring — Dr.Panjabrao Deshmukh Polytechnic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --maroon-900:#4F1520;
  --maroon-700:#7A1F2B;
  --maroon-600:#8F2635;
  --gold-600:#A9761B;
  --gold-100:#F1E2BE;
  --ink-900:#221D1A;
  --ink-700:#3B332E;
  --paper-50:#FBF7EE;
  --paper-100:#F2EAD6;
  --paper-200:#E7DBBB;
  --slate-600:#5B6570;
  --slate-300:#C6CDD3;
  --green-ok:#2F6B3A;
  --green-ok-bg:#E4F0E5;
  --red-no:#8C2F2F;
  --red-no-bg:#F5E6E6;
  --white:#FFFFFF;
  --shadow: 0 1px 2px rgba(34,29,26,.06), 0 4px 16px rgba(34,29,26,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper-50);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-100);}
a{color:inherit;}

/* ---------- layout shells ---------- */
#root{min-height:100vh;}
.hidden{display:none !important;}

.center-screen{
  min-height:100vh;display:flex;align-items:stretch;
}

/* ---------- LOGIN ---------- */
.login-wrap{display:flex;min-height:100vh;width:100%;}
.login-side{
  flex:1 1 42%;
  background:linear-gradient(165deg, var(--maroon-900), var(--maroon-700));
  color:var(--paper-50);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:48px 40px;text-align:center;position:relative;overflow:hidden;
}
.login-side img.seal{width:96px;height:auto;margin-bottom:22px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));}
.login-side h1{font-size:28px;line-height:1.25;font-weight:600;margin:0 0 10px;max-width:420px;}
.login-side p{font-size:14px;letter-spacing:.02em;color:var(--gold-100);margin:0;max-width:360px;}
.login-side .rule{width:64px;height:2px;background:var(--gold-600);margin:20px 0;}
.login-form-side{
  flex:1 1 58%;display:flex;align-items:center;justify-content:center;
  padding:32px;background:var(--paper-50);
}
.login-card{width:100%;max-width:380px;}
.login-card h2{font-size:22px;margin:0 0 4px;font-weight:600;}
.login-card .sub{color:var(--slate-600);font-size:13.5px;margin:0 0 24px;}
.role-toggle{display:flex;border:1px solid var(--paper-200);border-radius:8px;overflow:hidden;margin-bottom:22px;}
.role-toggle button{
  flex:1;padding:10px 8px;border:none;background:var(--white);color:var(--slate-600);
  font-size:13.5px;font-weight:600;transition:background .15s,color .15s;
}
.role-toggle button.active{background:var(--maroon-700);color:var(--white);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-700);margin-bottom:6px;letter-spacing:.01em;}
.field input,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--paper-200);border-radius:7px;
  font-size:14px;background:var(--white);color:var(--ink-900);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold-600);outline-offset:1px;border-color:var(--gold-600);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:7px;border:1px solid transparent;font-size:13.5px;font-weight:600;
  transition:filter .15s, background .15s;white-space:nowrap;
}
.btn-primary{background:var(--maroon-700);color:var(--white);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;}
.btn-ghost{background:transparent;color:var(--maroon-700);border-color:var(--paper-200);}
.btn-ghost:hover{background:var(--paper-100);}
.btn-outline{background:var(--white);color:var(--ink-700);border-color:var(--paper-200);}
.btn-outline:hover{background:var(--paper-100);}
.btn-danger{background:var(--red-no-bg);color:var(--red-no);border-color:#e3c9c9;}
.btn-danger:hover{filter:brightness(.97);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
.error-msg{background:var(--red-no-bg);color:var(--red-no);border:1px solid #e3c9c9;padding:9px 12px;border-radius:7px;font-size:13px;margin-bottom:16px;}
.hint-box{background:var(--paper-100);border:1px solid var(--paper-200);color:var(--ink-700);padding:10px 12px;border-radius:7px;font-size:12.5px;margin-top:18px;line-height:1.5;}

/* ---------- APP SHELL ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--maroon-900);color:var(--paper-50);
  display:flex;flex-direction:column;padding:22px 14px;
}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.12);}
.sidebar .brand img{width:34px;height:auto;}
.sidebar .brand div{font-size:12.5px;line-height:1.3;font-weight:600;color:var(--gold-100);}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;color:var(--paper-100);
  font-size:13.5px;font-weight:500;background:transparent;border:none;text-align:left;width:100%;margin-bottom:2px;
}
.nav-item:hover{background:rgba(255,255,255,.08);}
.nav-item.active{background:var(--gold-600);color:var(--maroon-900);font-weight:700;}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);}
.who{font-size:12px;color:var(--gold-100);padding:0 12px 8px;line-height:1.4;}
.who b{color:var(--white);display:block;font-size:13px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 28px;border-bottom:1px solid var(--paper-200);background:var(--white);
}
.topbar h2{margin:0;font-size:20px;font-weight:600;}
.topbar .crumb{font-size:12.5px;color:var(--slate-600);margin-top:2px;}
.content{padding:26px 28px 60px;max-width:1280px;width:100%;}

.card{background:var(--white);border:1px solid var(--paper-200);border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-head h3{margin:0;font-size:15.5px;font-weight:700;}
.card-head p{margin:2px 0 0;font-size:12.5px;color:var(--slate-600);}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
.stat{background:var(--white);border:1px solid var(--paper-200);border-top:3px solid var(--maroon-700);border-radius:8px;padding:16px;box-shadow:var(--shadow);}
.stat .num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--maroon-900);}
.stat .lbl{font-size:12px;color:var(--slate-600);margin-top:2px;}

table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate-600);
  padding:9px 10px;border-bottom:2px solid var(--paper-200);font-weight:700;
}
table.data-table td{padding:10px 10px;border-bottom:1px solid var(--paper-100);vertical-align:middle;}
table.data-table tr:hover td{background:var(--paper-50);}
.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;background:var(--paper-100);color:var(--ink-700);}
.empty-state{text-align:center;padding:44px 20px;color:var(--slate-600);}
.empty-state .big{font-family:'Fraunces',serif;font-size:17px;color:var(--ink-900);margin-bottom:6px;}
.row-actions{display:flex;gap:6px;}

.modal-backdrop{position:fixed;inset:0;background:rgba(34,29,26,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--white);border-radius:10px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal.modal-wide{max-width:640px;}
.modal h3{margin:0 0 4px;font-size:17px;}
.modal .sub{color:var(--slate-600);font-size:12.5px;margin:0 0 18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}

.assign-matrix{width:100%;border-collapse:collapse;font-size:12px;}
.assign-matrix th,.assign-matrix td{border:1px solid var(--paper-200);padding:6px 8px;text-align:center;}
.assign-matrix th{background:var(--paper-100);color:var(--ink-700);font-weight:700;font-size:11.5px;}
.assign-matrix td:first-child{text-align:left;background:var(--paper-50);font-weight:600;}
.assign-matrix input[type=checkbox]{width:15px;height:15px;cursor:pointer;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--paper-200);margin-bottom:18px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:9px 14px;font-size:13px;font-weight:600;color:var(--slate-600);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabs button.active{color:var(--maroon-700);border-bottom-color:var(--maroon-700);}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink-900);color:var(--white);padding:11px 20px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;}

/* ---------- FILL FORM ---------- */
.form-toprow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:4px;}
@media (max-width:720px){.form-toprow{grid-template-columns:1fr;}}
.scroll-table-wrap{overflow-x:auto;border:1px solid var(--paper-200);border-radius:8px;}
table.entry-table{border-collapse:collapse;width:100%;min-width:1500px;font-size:12px;}
table.entry-table th{
  background:var(--paper-100);color:var(--ink-700);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  padding:7px 6px;border:1px solid var(--paper-200);text-align:center;white-space:nowrap;
}
table.entry-table td{padding:5px 6px;border:1px solid var(--paper-100);text-align:center;vertical-align:middle;}
table.entry-table select.subj-select{width:190px;font-size:12px;padding:5px 6px;border:1px solid var(--paper-200);border-radius:5px;}
table.entry-table input.remarks-input{width:140px;font-size:12px;padding:5px 6px;border:1px solid var(--paper-200);border-radius:5px;}
table.entry-table input.num-input{width:56px;font-size:12px;padding:5px 6px;border:1px solid var(--paper-200);border-radius:5px;text-align:center;}
.toggle-btn{
  width:34px;height:26px;border-radius:5px;border:1px solid var(--paper-200);background:var(--white);
  font-size:11px;font-weight:700;color:var(--slate-600);
}
.toggle-btn.y{background:var(--green-ok-bg);color:var(--green-ok);border-color:#bcdcc0;}
.toggle-btn.n{background:var(--red-no-bg);color:var(--red-no);border-color:#e3c9c9;}
.toggle-btn.na{background:var(--paper-200);color:var(--ink-700);border-color:#d8cba0;}
.toggle-btn.invalid,.num-input.invalid,select.subj-select.invalid,input.remarks-input.invalid{
  outline:2px solid var(--red-no);outline-offset:1px;border-color:var(--red-no);
}
.row-num{font-weight:700;color:var(--slate-600);}
.remove-row-btn{background:none;border:none;color:var(--red-no);font-size:16px;line-height:1;padding:4px;}
.form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap;gap:10px;}
.hod-field-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--paper-100);}
.hod-field-row:last-child{border-bottom:none;}
.hod-field-row>span:first-child{font-size:13.5px;color:var(--ink-700);}

/* ---------- PRINT SHEET ---------- */
.sheet-outer-wrap{background:var(--paper-100);padding:34px 20px;}
.sheet{
  background:#fff;max-width:1400px;margin:0 auto;padding:26px 32px 20px;
  border:1px solid var(--paper-200);box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.sheet-header{text-align:center;margin-bottom:6px;}
.sheet-header img.seal{width:60px;height:auto;margin-bottom:6px;}
.sheet-header h1{font-size:24px;margin:0;font-weight:700;letter-spacing:.01em;text-decoration:underline;}
.sheet-rule{border:none;border-top:2px solid var(--ink-900);margin:8px 0 2px;}
.sheet-rule.thin{border-top:1px solid var(--ink-900);margin:2px 0 10px;}
.sheet-subtitle{text-align:center;font-weight:700;font-size:13.5px;margin:6px 0 12px;letter-spacing:.02em;}
.sheet-meta{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.sheet-meta span b{border-bottom:1px solid var(--ink-900);padding-bottom:1px;font-weight:600;}
.sheet-table-wrap{position:relative;overflow-x:auto;}
.watermark-img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:360px;opacity:.16;pointer-events:none;z-index:0;}
table.print-table{border-collapse:collapse;width:100%;position:relative;z-index:1;font-size:9.5px;table-layout:fixed;background:transparent;}
table.print-table th,table.print-table td{border:1px solid var(--ink-900);padding:3px 4px;text-align:center;word-break:break-word;background:transparent;}
table.print-table th{font-size:9px;font-weight:700;}
table.print-table td.left{text-align:left;}
.sheet-sign{display:flex;justify-content:space-between;margin-top:26px;font-size:12.5px;flex-wrap:wrap;gap:14px;}
.sheet-sign b{font-weight:700;}
.sheet-footer-rule{border:none;border-top:2px solid var(--ink-900);margin:20px 0 8px;}
.sheet-vision{font-size:10.5px;text-align:left;line-height:1.6;}
.sheet-vision u{text-decoration:underline;}
.sheet-toolbar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:var(--white);border-bottom:1px solid var(--paper-200);}

@media print{
  body{background:#fff;}
  .no-print{display:none !important;}
  .sheet-outer-wrap{background:#fff;padding:0;}
  .sheet{box-shadow:none;border:none;padding:0;max-width:100%;}
  @page{size:A4 landscape;margin:9mm;}
}
@media (max-width:900px){
  .login-wrap{flex-direction:column;}
  .login-side{padding:28px 24px;flex:none;}
  .login-side img.seal{width:64px;margin-bottom:12px;}
  .login-side h1{font-size:20px;}
  .login-side p{font-size:12.5px;}
  .login-side .rule{margin:12px 0;}
  .login-form-side{padding:24px;}

  .app-shell{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:4px;}
  .sidebar .brand{border-bottom:none;padding:0 10px 0 0;margin:0;flex:0 0 auto;}
  .sidebar .brand img{width:26px;}
  .sidebar .brand div{display:none;}
  .nav-item{width:auto;padding:8px 12px;margin-bottom:0;}
  .sidebar-footer{margin-top:0;padding-top:0;border-top:none;margin-left:auto;display:flex;align-items:center;gap:10px;}
  .who{display:none;}
  .content{padding:16px;}
  .topbar{padding:14px 16px;flex-wrap:wrap;gap:10px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:520px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .card{padding:14px;}
  .sheet{padding:16px 14px 14px;}
}
</style>
</head>

/* Low-level calls to the Apps Script Web App, which reads/writes a "Data"
   tab in your Google Sheet (columns: key, value, updatedAt). */
async function sheetGetAll(){
  const res = await fetch(SHEETS_WEBAPP_URL + '?action=getAll', {method:'GET'});
  if(!res.ok) throw new Error('Sheet request failed (HTTP ' + res.status + ')');
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Apps Script returned an error');
  return json.data || {};
}
async function sheetSet(key, value){
  const res = await fetch(SHEETS_WEBAPP_URL, {
    method: 'POST',
    body: JSON.stringify({ key, value: JSON.stringify(value) }),
  });
  if(!res.ok) throw new Error('Sheet request failed (HTTP ' + res.status + ')');
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Apps Script returned an error');
  return true;
}
async function persistOrToast(key){
  try{
    await sheetSet(key, data[key]);
    return true;
  }catch(e){
    console.error('save failed', key, e);
    showToast('Could not save to Google Sheet — check your connection and try again.');
    return false;
  }
}

    officeOrder: null, // {fileName, mimeType, uploadedAt, chunkCount} — the PDF bytes live in separate officeOrderChunkN keys
  };
}
function defaultDepartments(){
  return [
    {id:uid(), name:"Computer Engineering", chairmanName:""},
    {id:uid(), name:"Electronics Engineering", chairmanName:""},
    {id:uid(), name:"Civil Engineering", chairmanName:""},
  ];
}

function parseCell(raw, key, fallback){
  if(raw===undefined || raw===null || raw==='') return fallback;
  try{ return JSON.parse(raw); }catch(e){ console.error('Could not parse sheet value for', key, e); return fallback; }
}

async function loadAll(){
  const raw = await sheetGetAll(); // {key: jsonString, ...}
  const isFirstRun = !raw || raw.config===undefined;
  let configWasMissingFields = false;
  if(isFirstRun){
    data.config = defaultConfig();
    data.departments = defaultDepartments();
    data.members = [];
    data.offerings = [];
    data.submissions = [];
    data.hodReports = [];
    data.officeOrderDataUrl = null;
    await Promise.all([
      sheetSet('config', data.config),
      sheetSet('departments', data.departments),
      sheetSet('members', data.members),
      sheetSet('offerings', data.offerings),
      sheetSet('submissions', data.submissions),
      sheetSet('hodReports', data.hodReports),
    ]);
  }else{
    const storedConfig = parseCell(raw.config, 'config', {});
    const defaults = defaultConfig();
    configWasMissingFields = Object.keys(defaults).some(k => !(k in storedConfig));
    data.config = Object.assign(defaults, storedConfig);
    data.departments = parseCell(raw.departments, 'departments', defaultDepartments());
    data.members = parseCell(raw.members, 'members', []);
    data.offerings = parseCell(raw.offerings, 'offerings', []);
    data.submissions = parseCell(raw.submissions, 'submissions', []);
    data.hodReports = parseCell(raw.hodReports, 'hodReports', []);
    data.officeOrderDataUrl = reconstructOfficeOrder(raw, data.config.officeOrder);
  }
  migrateData();
  // If this sheet's config row pre-dates a newer field (e.g. coordinatorPassword),
  // write the backfilled defaults so the sheet itself has them from now on —
  // otherwise every reload would silently patch them in memory only.
  if(configWasMissingFields) persist('config');
}

/* The office order PDF is too big for one Google Sheets cell (50,000 char
   limit), so it's uploaded in chunks under separate keys (officeOrderChunk0,
   officeOrderChunk1, ...) and reassembled here into a data: URL. Only the
   small metadata object (name, size, chunk count) lives in data.config. */
const OFFICE_ORDER_CHUNK_SIZE = 40000;
const OFFICE_ORDER_MAX_BYTES = 10 * 1024 * 1024; // 10MB raw file
function reconstructOfficeOrder(raw, meta){
  if(!meta || !meta.chunkCount) return null;
  let combined = '';
  for(let i=0;i<meta.chunkCount;i++){
    const chunk = raw['officeOrderChunk'+i];
    if(chunk===undefined) return null; // incomplete upload — treat as missing rather than show a corrupt file
    combined += JSON.parse(chunk);
  }
  return `data:${meta.mimeType};base64,${combined}`;
}
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('Could not read the file.'));
    reader.readAsDataURL(file);
  });
}

/* Older versions of this app assigned a member to one whole department, and
   didn't track which semester a subject belongs to. Upgrade those records
   in memory (and re-save) the first time they're encountered. */
function migrateData(){
  let changedMembers = false, changedOfferings = false;
  data.members.forEach(m=>{
    if(!Array.isArray(m.assignments)){
      m.assignments = m.departmentId
        ? [1,2,3,4,5,6].map(s=>({departmentId:m.departmentId, semester:String(s)}))
        : [];
      delete m.departmentId;
      changedMembers = true;
    }
  });
  data.offerings.forEach(o=>{
    if(o.semester===undefined){ o.semester = ''; changedOfferings = true; }
  });
  if(changedMembers) persist('members');
  if(changedOfferings) persist('offerings');
}

function memberAssignments(mem){
  if(!mem || !Array.isArray(mem.assignments)) return [];
  return mem.assignments
    .map(a=>({ departmentId:a.departmentId, semester:String(a.semester), dept: deptById(a.departmentId) }))
    .filter(a=>a.dept)
    .map(a=>({ departmentId:a.departmentId, semester:a.semester, deptName:a.dept.name }))
    .sort((a,b)=> a.deptName.localeCompare(b.deptName) || Number(a.semester)-Number(b.semester));
}
function assignmentBadgeHtml(mem){
  const assigns = memberAssignments(mem);
  if(assigns.length===0) return '<span style="color:var(--slate-600)">No assignments</span>';
  const byDept = {};
  assigns.forEach(a=>{ (byDept[a.deptName] = byDept[a.deptName]||[]).push(a.semester); });
  return Object.entries(byDept).map(([name,sems])=>
    `<span class="badge" style="margin:2px 4px 2px 0;">${escapeHtml(name)}: Sem ${sems.join(', ')}</span>`
  ).join('');
}

}

async function uploadOfficeOrder(){
  const input = document.getElementById('officeOrderFile');
  const file = input.files && input.files[0];
  if(!file){ showToast('Choose a PDF file first.'); return; }
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if(!isPdf){ showToast('Please choose a PDF file.'); return; }
  if(file.size > OFFICE_ORDER_MAX_BYTES){
    showToast(`That file is too large (${(file.size/1024/1024).toFixed(1)}MB) — please keep office orders under ${OFFICE_ORDER_MAX_BYTES/1024/1024}MB.`);
    return;
  }
  const btn = document.getElementById('ooUploadBtn');
  const progressEl = document.getElementById('ooProgress');
  btn.disabled = true; btn.textContent = 'Uploading…';
  try{
    const base64 = await fileToBase64(file);
    const chunkCount = Math.ceil(base64.length / OFFICE_ORDER_CHUNK_SIZE) || 1;
    for(let i=0;i<chunkCount;i++){
      if(progressEl) progressEl.textContent = `Uploading part ${i+1} of ${chunkCount}…`;
      const chunk = base64.slice(i*OFFICE_ORDER_CHUNK_SIZE, (i+1)*OFFICE_ORDER_CHUNK_SIZE);
      await sheetSet('officeOrderChunk'+i, chunk);
    }
    data.config.officeOrder = { fileName: file.name, mimeType: file.type || 'application/pdf', uploadedAt: Date.now(), chunkCount };
    data.officeOrderDataUrl = `data:${data.config.officeOrder.mimeType};base64,${base64}`;
    if(progressEl) progressEl.textContent = '';
    showToast('Office order uploaded.');
    render();
    persist('config');
  }catch(e){
    console.error(e);
    showToast('Upload failed partway through — check your connection and try again.');
    if(btn){ btn.disabled=false; btn.textContent='Upload'; }
    if(progressEl) progressEl.textContent = '';
  }
}
function removeOfficeOrder(){
  if(!confirm('Remove the office order? Committee members will no longer see it. (This only unlinks it — the uploaded parts stay in your Google Sheet.)')) return;
  data.config.officeOrder = null;
  data.officeOrderDataUrl = null;
  render();
  showToast('Office order removed.');
  persist('config');
}

function openMemberModal(id){

    <div class="field"><label>Password</label><input id="mMemPass" value="${escapeHtml(m.password)}" placeholder="Set a password"></div>
    <div class="field">
      <label>Department + semester assignments</label>
      <p class="sub" style="margin:-2px 0 8px;">Tick every department/semester this member is responsible for assessing. Use the row and column checkboxes to tick a whole semester (all departments) or a whole department (all semesters) at once.</p>
      ${data.departments.length===0 ? '<div class="hint-box">Add a department first.</div>' : `
      <table class="assign-matrix">
        <thead>
          <tr>
            <th style="width:70px;"></th>
            ${data.departments.map(d=>`<th><label style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" onchange="toggleAssignCol('${d.id}', this.checked)"><span>${escapeHtml(d.name)}</span></label></th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${sems.map(s=>`
          <tr>
            <td><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" onchange="toggleAssignRow(${s}, this.checked)"> Sem ${s}</label></td>
            ${data.departments.map(d=>`<td><input type="checkbox" class="assign-cell" data-dept="${d.id}" data-sem="${s}" ${assignSet.has(d.id+'::'+s)?'checked':''}></td>`).join('')}
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveMember('${id||''}')">Save</button></div>
  `};
  render();
}
function toggleAssignCol(deptId, checked){
  document.querySelectorAll(`.assign-cell[data-dept="${deptId}"]`).forEach(cb=> cb.checked = checked);
}
function toggleAssignRow(sem, checked){
  document.querySelectorAll(`.assign-cell[data-sem="${sem}"]`).forEach(cb=> cb.checked = checked);
}
function saveMember(id){
  const name = document.getElementById('mMemName').value.trim();
  const username = document.getElementById('mMemUser').value.trim();
  const password = document.getElementById('mMemPass').value;
  if(!name || !username || !password){ showToast('Name, username and password are all required.'); return; }
  const dupe = data.members.find(x=>x.username.toLowerCase()===username.toLowerCase() && x.id!==id);
  if(dupe){ showToast('That username is already taken.'); return; }
  const assignments = [];
  document.querySelectorAll('.assign-cell').forEach(cb=>{
    if(cb.checked) assignments.push({ departmentId: cb.getAttribute('data-dept'), semester: cb.getAttribute('data-sem') });
  });
  if(assignments.length===0){ showToast('Tick at least one department + semester for this member.'); return; }
  if(id){
    const m = memberById(id); m.name=name; m.username=username; m.password=password; m.assignments=assignments;
  }else{
    data.members.push({id:uid(), name, username, password, assignments});
  }
  closeModal(); showToast('Committee member saved.');
  persist('members');
}
function deleteMember(id){
  if(!confirm('Remove this committee member? They will no longer be able to sign in.')) return;
  data.members = data.members.filter(m=>m.id!==id);
  render(); showToast('Member removed.');
  persist('members');
}

function existingSubmissionFor(departmentId, semester){
  const matches = data.submissions.filter(s=>s.departmentId===departmentId && String(s.semester)===String(semester));
  if(matches.length===0) return null;
  return matches.slice().sort((a,b)=>(b.updatedAt||b.submittedAt)-(a.updatedAt||a.submittedAt))[0];
}

function renderMemberHome(mem){
  const assigns = memberAssignments(mem);
  if(assigns.length===0){
    return emptyState('No assignments yet', 'Ask your admin to assign you to at least one department + semester before you can file a report.');

function blankRow(){
  const r = {offeringId:'', courseCode:'', subjectName:'', teacherName:'', currentTarget:'', remarks:''};
  TOGGLE_FIELDS.forEach(f=> r[f.key]='');
  PERIOD_FIELDS.forEach(f=> r[f.key]='');
  return r;
}
async function startNewReport(departmentId, semester){
  showToast('Loading latest assignment data…');
  try{ await loadAll(); }catch(e){ console.error(e); showToast('Could not refresh from the sheet — using last-loaded data.'); }
  const mem = currentMember();
  if(!mem){ showToast('Your session data is out of date — please log in again.'); render(); return; }
  const assigns = memberAssignments(mem);
  if(assigns.length===0){ showToast('You have no department + semester assignments yet. Ask your admin to assign you one.'); render(); return; }

  if(departmentId===undefined || semester===undefined){
    const open = assigns.filter(a=> !existingSubmissionFor(a.departmentId, a.semester));
    if(open.length===0){ showToast('Every one of your assignments already has a report filed. Use Edit from Past reports to change one.'); render(); return; }
    if(open.length===1){
      departmentId = open[0].departmentId; semester = open[0].semester;
    }else{
      openAssignmentPicker(open);
      return;
    }
  }
  const dep = deptById(departmentId);
  if(!dep){ showToast('That department no longer exists.'); render(); return; }
  // A department + semester can only be reported on once — if one already
  // exists (e.g. filed by a teammate who shares this assignment, or this
  // page was left open in another tab), open it instead of starting a new one.
  const existing = existingSubmissionFor(departmentId, semester);
  if(existing){
    showToast(`A report for ${dep.name} · Semester ${semester} already exists — opening it.`);
    openPreview(existing.id, 'member');
    return;
  }
  state.draft = {
    departmentId: dep.id,
    semester: String(semester),
    date: new Date().toISOString().slice(0,10),
    facultyMemberName: mem.name,
    chairmanName: dep.chairmanName || '',
    rows: Array.from({length:6}, blankRow),
  };
  state.memberView='fill'; render();
}
function openAssignmentPicker(assigns){
  state.modal = { html: `
    <h3>Choose what to report on</h3>
    <p class="sub">You're assigned to more than one department / semester. Pick one to continue.</p>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${assigns.map(a=>`
        <button class="btn btn-outline" style="justify-content:space-between;width:100%;" onclick="closeModal(); startNewReport('${a.departmentId}','${a.semester}')">
          <span>${escapeHtml(a.deptName)}</span><span style="color:var(--slate-600);">Semester ${escapeHtml(a.semester)}</span>
        </button>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>
  `};
  render();
}
function addDraftRow(){ state.draft.rows.push(blankRow()); render(); }
function removeDraftRow(i){ if(state.draft.rows.length<=1){ showToast('At least one row is required.'); return;} state.draft.rows.splice(i,1); render(); }
function updateDraftField(field, val, el){
  state.draft[field]=val;
  if(el && state.draft.showErrors && (field==='facultyMemberName'||field==='chairmanName')){
    el.classList.toggle('invalid', !String(val).trim());
  }
}
function updateRowOffering(i, offeringId){
  const row = state.draft.rows[i];
  row.offeringId = offeringId;
  const off = data.offerings.find(o=>o.id===offeringId);
  if(off){ row.courseCode=off.courseCode; row.subjectName=off.subjectName; row.teacherName=off.teacherName; }
  else{ row.courseCode=''; row.subjectName=''; row.teacherName=''; }
  render(); // needs a full re-render so other rows' dropdowns exclude/re-include this subject
}
/* Toggle buttons update the DOM directly instead of calling render(), so
   clicking a cell on the far right of the wide table never rebuilds the
   page and never resets the horizontal scroll position. */
function toggleRowField(i, key){
  const row = state.draft.rows[i];
  row[key] = nextToggleState(row[key]);
  const btn = document.querySelector(`.toggle-btn[data-row="${i}"][data-key="${key}"]`);
  if(btn){
    const invalid = state.draft.showErrors && row.offeringId && row[key]==='';
    btn.className = 'toggle-btn ' + toggleClass(row[key]) + (invalid ? ' invalid' : '');
    btn.textContent = row[key] || '–';
  }else{
    render();
  }
}
function updateRowText(i, key, val, el){
  state.draft.rows[i][key]=val;
  if(el && state.draft && state.draft.showErrors){
    const isEmpty = (val===undefined || val===null || String(val).trim()==='');
    el.classList.toggle('invalid', isEmpty);
  }
}
function resetDraftForm(){

}

    ${showErrors ? `<div class="hint-box" style="background:var(--red-no-bg);border-color:#e3c9c9;color:var(--red-no);">Some required fields are missing — they're outlined in red below. Every subject you add needs all columns filled (use <b>NA</b> where a column doesn't apply).</div>` : ''}
    <div class="scroll-table-wrap">

          <th rowspan="2">Test &<br>ESE</th>
          <th rowspan="2">Low<br>profile</th>
          <th rowspan="2">Bright<br>student</th>
          <th rowspan="2">K1</th><th rowspan="2">K2</th><th rowspan="2">K3</th><th rowspan="2">K5</th><th rowspan="2">K6</th>
          <th rowspan="2">K7<br>Part-A</th>

      </thead>
      <tbody>
        ${d.rows.map((row,i)=>{
          const usedElsewhere = new Set(d.rows.filter((r,idx)=>idx!==i && r.offeringId).map(r=>r.offeringId));

function toggleCellsForRow(i, row, showErrors){
  let html = '';
  html += toggleCellHtml(i, row, 'coPoPso', showErrors);
  html += numCellHtml(i, row, 'currentTarget', showErrors, '#');
  ['testEse','lowProfile','bright','k1','k2','k3','k5','k6','k7','attTh','attPr','attTu'].forEach(key=>{
    html += toggleCellHtml(i, row, key, showErrors);
  });
  ['perTh','perPr','perTu'].forEach(key=>{
    html += numCellHtml(i, row, key, showErrors, '0');
  });
  return html;
}
function toggleCellHtml(i, row, key, showErrors){
  const v = row[key];
  const cls = toggleClass(v);
  const invalid = (showErrors && row.offeringId && v==='') ? ' invalid' : '';
  return `<td><button class="toggle-btn ${cls}${invalid}" data-row="${i}" data-key="${key}" onclick="toggleRowField(${i},'${key}')" title="Tap to cycle: blank → Y → N → NA">${v||'–'}</button></td>`;
}
function numCellHtml(i, row, key, showErrors, placeholder){
  const empty = row[key]===''||row[key]===undefined||row[key]===null;
  const invalid = (showErrors && row.offeringId && empty) ? ' invalid' : '';
  return `<td><input class="num-input${invalid}" value="${escapeHtml(row[key])}" oninput="updateRowText(${i},'${key}',this.value,this)" placeholder="${placeholder}"></td>`;
}
function cancelDraft(){
  const wasEditing = !!(state.draft && state.draft.editingId);
  if(confirm(wasEditing ? 'Discard changes to this report?' : 'Discard this in-progress report?')){
    state.draft = null;
    state.memberView = wasEditing ? 'submissions' : 'home';
    render();
  }
}
function computeRowMissingFields(row){
  if(!row.offeringId) return [];
  const missing = [];
  if(row.currentTarget===''||row.currentTarget===undefined||row.currentTarget===null) missing.push('Current Target');
  TOGGLE_FIELDS.forEach(f=>{ if(row[f.key]==='') missing.push(f.label); });
  PERIOD_FIELDS.forEach(f=>{ if(row[f.key]===''||row[f.key]===undefined||row[f.key]===null) missing.push(f.label); });
  if(!(row.remarks||'').trim()) missing.push('Remarks');
  return missing;
}
function submitDraft(){
  const d = state.draft;
  const filledRows = d.rows.filter(r=>r.offeringId);
  if(filledRows.length===0){ showToast('Add at least one subject before saving.'); return; }
  if(!(d.facultyMemberName||'').trim() || !(d.chairmanName||'').trim()){
    d.showErrors = true; render();
    showToast('Committee Faculty Member and Committee Chairman names are both required.');
    return;
  }
  let firstBadRow = null, totalMissing = 0;
  d.rows.forEach((row, idx)=>{
    const missing = computeRowMissingFields(row);
    if(missing.length>0){ totalMissing += missing.length; if(firstBadRow===null) firstBadRow = idx; }
  });
  if(firstBadRow!==null){
    d.showErrors = true;
    render();
    showToast(`Row ${firstBadRow+1} is missing ${totalMissing} required field(s) — every column must be Y, N or NA (or a number) before you can submit.`);
    return;
  }
  const mem = currentMember();
  const payload = {
    departmentId: d.departmentId,
    semester: d.semester,
    date: d.date,
    examTerm: data.config.examTerm,
    academicSession: data.config.academicSession,
    instituteName: data.config.instituteName,
    rows: d.rows,
    facultyMemberName: d.facultyMemberName,
    chairmanName: d.chairmanName,
  };
  if(d.editingId){
    const existing = data.submissions.find(s=>s.id===d.editingId);
    if(!existing){ showToast('This report no longer exists.'); state.draft=null; state.memberView='home'; render(); return; }
    Object.assign(existing, payload);
    existing.updatedAt = Date.now();
    existing.updatedByName = mem.name;
    state.draft = null;
    openPreview(existing.id, 'member');
    showToast('Report updated.');
    persist('submissions');
  }else{
    const submission = {
      id: uid(),
      ...payload,
      submittedByUsername: mem.username,
      submittedByName: mem.name,
      submittedAt: Date.now(),
    };
    data.submissions.push(submission);
    state.draft = null;
    openPreview(submission.id, 'member');
    showToast('Report saved.');
    persist('submissions');
  }
}
function editSubmission(id){
  const s = data.submissions.find(x=>x.id===id);
  if(!s){ showToast('Report not found.'); return; }
  const dep = deptById(s.departmentId);
  const rows = JSON.parse(JSON.stringify(s.rows)).map(r=>{
    TOGGLE_FIELDS.forEach(f=>{ if(r[f.key]===undefined) r[f.key]=''; });
    PERIOD_FIELDS.forEach(f=>{ if(r[f.key]===undefined) r[f.key]=''; });
    if(r.remarks===undefined) r.remarks='';
    if(r.currentTarget===undefined) r.currentTarget='';
    return r;
  });
  state.draft = {
    editingId: s.id,
    departmentId: s.departmentId,
    semester: s.semester,
    date: s.date,
    facultyMemberName: s.facultyMemberName || '',
    chairmanName: s.chairmanName || (dep?dep.chairmanName:'') || '',
    rows,
    showErrors: false,
  };
  state.memberView = 'fill';
  render();
}

function blankHodDraft(departmentId, semester){
  const d = { departmentId, semester:String(semester), date:new Date().toISOString().slice(0,10), completionPercent:'', coordinatorName: data.config.coordinatorName || '', showErrors:false };
  HOD_TOGGLE_FIELDS.forEach(f=> d[f.key]='');
  HOD_NUMBER_FIELDS.forEach(f=> d[f.key]='');
  HOD_TEXT_FIELDS.forEach(f=> d[f.key]='');
  return d;
}
async function startNewHodReport(departmentId, semester){
  showToast('Loading latest data…');
  try{ await loadAll(); }catch(e){ console.error(e); showToast('Could not refresh from the sheet — using last-loaded data.'); }
  const dep = deptById(departmentId);
  if(!dep){ showToast('That department no longer exists.'); render(); return; }
  const existing = existingHodReportFor(departmentId, semester);
  if(existing){
    showToast(`A report for ${dep.name} · Semester ${semester} already exists — opening it.`);
    openHodPreview(existing.id, 'coordinator');
    return;
  }
  state.hodDraft = blankHodDraft(departmentId, semester);
  state.coordinatorView = 'fill';
  render();
}
function updateHodField(field, val, el){
  state.hodDraft[field] = val;
  if(el && state.hodDraft.showErrors){
    el.classList.toggle('invalid', !String(val).trim());
  }
}
function toggleHodField(key){
  const d = state.hodDraft;
  d[key] = nextYN(d[key]);
  const btn = document.querySelector(`.toggle-btn[data-hod="${key}"]`);
  if(btn){
    const invalid = d.showErrors && d[key]==='';
    btn.className = 'toggle-btn ' + toggleClass(d[key]) + (invalid ? ' invalid' : '');
    btn.textContent = d[key] || '–';
  }else{
    render();
  }
}
function resetHodDraftForm(){
  if(!confirm('Clear all entered monitoring data in this form? Department, semester, date and the coordinator name are kept.')) return;
  const kept = { departmentId: state.hodDraft.departmentId, semester: state.hodDraft.semester, date: state.hodDraft.date, coordinatorName: state.hodDraft.coordinatorName, editingId: state.hodDraft.editingId };
  state.hodDraft = Object.assign(blankHodDraft(kept.departmentId, kept.semester), kept);
  render();
}
function cancelHodDraft(){
  const wasEditing = !!(state.hodDraft && state.hodDraft.editingId);
  if(confirm(wasEditing ? 'Discard changes to this report?' : 'Discard this in-progress report?')){
    state.hodDraft = null;
    state.coordinatorView = 'reports';
    render();
  }
}
function computeHodMissingFields(d){
  const missing = [];
  if(d.completionPercent===''||d.completionPercent===undefined||d.completionPercent===null) missing.push('Completion of Syllabus %');
  HOD_TOGGLE_FIELDS.forEach(f=>{ if(d[f.key]==='') missing.push(f.label); });
  HOD_NUMBER_FIELDS.forEach(f=>{ if(d[f.key]===''||d[f.key]===undefined||d[f.key]===null) missing.push(f.label); });
  HOD_TEXT_FIELDS.forEach(f=>{ if(!(d[f.key]||'').trim()) missing.push(f.label); });
  return missing;
}
function submitHodDraft(){
  const d = state.hodDraft;
  if(!(d.coordinatorName||'').trim()){
    d.showErrors = true; render();
    showToast('Academic Co-ordinator name is required.');
    return;
  }
  const missing = computeHodMissingFields(d);
  if(missing.length>0){
    d.showErrors = true; render();
    showToast(`${missing.length} field(s) still need to be filled — every column is required.`);
    return;
  }
  const payload = {
    departmentId: d.departmentId,
    semester: d.semester,
    date: d.date,
    examTerm: data.config.examTerm,
    academicSession: data.config.academicSession,
    instituteName: data.config.instituteName,
    completionPercent: d.completionPercent,
    coordinatorName: d.coordinatorName,
  };
  HOD_TOGGLE_FIELDS.forEach(f=> payload[f.key]=d[f.key]);
  HOD_NUMBER_FIELDS.forEach(f=> payload[f.key]=d[f.key]);
  HOD_TEXT_FIELDS.forEach(f=> payload[f.key]=d[f.key]);

  if(d.editingId){
    const existing = data.hodReports.find(r=>r.id===d.editingId);
    if(!existing){ showToast('This report no longer exists.'); state.hodDraft=null; state.coordinatorView='reports'; render(); return; }
    Object.assign(existing, payload);
    existing.updatedAt = Date.now();
    existing.updatedByName = d.coordinatorName;
    state.hodDraft = null;
    openHodPreview(existing.id, 'coordinator');
    showToast('Report updated.');
    persist('hodReports');
  }else{
    const report = {
      id: uid(),
      ...payload,
      submittedByName: d.coordinatorName,
      submittedAt: Date.now(),
    };
    data.hodReports.push(report);
    state.hodDraft = null;
    openHodPreview(report.id, 'coordinator');
    showToast('Report saved.');
    persist('hodReports');
  }
}
function editHodReport(id){
  const r = data.hodReports.find(x=>x.id===id);
  if(!r){ showToast('Report not found.'); return; }
  state.hodDraft = {
    editingId: r.id,
    departmentId: r.departmentId,
    semester: r.semester,
    date: r.date,
    completionPercent: r.completionPercent!==undefined?r.completionPercent:'',
    coordinatorName: r.coordinatorName || '',
    showErrors: false,
  };
  HOD_TOGGLE_FIELDS.forEach(f=> state.hodDraft[f.key] = r[f.key]!==undefined?r[f.key]:'');
  HOD_NUMBER_FIELDS.forEach(f=> state.hodDraft[f.key] = r[f.key]!==undefined?r[f.key]:'');
  HOD_TEXT_FIELDS.forEach(f=> state.hodDraft[f.key] = r[f.key]!==undefined?r[f.key]:'');
  state.coordinatorView = 'fill';
  render();
}
function renderHodFillForm(){

  const d = state.hodDraft;
  const dep = deptById(d.departmentId);
  const showErrors = !!d.showErrors;
  const rowField = (label, inner)=>`<div class="hod-field-row"><span>${escapeHtml(label)}</span>${inner}</div>`;
  return `
  <div class="card">
    <div class="card-head"><div><h3>Report details</h3><p>Academic Monitoring · Internal Monitoring (${escapeHtml(data.config.examTerm)}) for HODs</p></div></div>
    <div class="form-toprow">
      <div class="field"><label>Department</label><input value="${escapeHtml(dep?dep.name:'—')}" disabled style="background:var(--paper-100);color:var(--ink-700);font-weight:600;"></div>
      <div class="field"><label>Semester</label><input value="Semester ${escapeHtml(d.semester)}" disabled style="background:var(--paper-100);color:var(--ink-700);font-weight:600;"></div>
      <div class="field"><label>Date</label><input type="date" value="${d.date}" onchange="updateHodField('date', this.value)"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><div><h3>Monitoring details</h3><p>Every field is required, matching the official Academic Monitoring format.</p></div></div>
    ${showErrors ? `<div class="hint-box" style="background:var(--red-no-bg);border-color:#e3c9c9;color:var(--red-no);">Some required fields are missing — they're outlined in red below.</div>` : ''}
    ${rowField('Completion of Syllabus in % up to internal monitoring', `<input class="num-input${showErrors && d.completionPercent===''?' invalid':''}" style="width:80px;" value="${escapeHtml(d.completionPercent)}" oninput="updateHodField('completionPercent', this.value, this)" placeholder="%">`)}
    ${HOD_TOGGLE_FIELDS.slice(0,5).map(f=>{
      const v=d[f.key]; const invalid = showErrors && v==='';
      return rowField(f.label, `<button class="toggle-btn ${toggleClass(v)}${invalid?' invalid':''}" data-hod="${f.key}" onclick="toggleHodField('${f.key}')">${v||'–'}</button>`);
    }).join('')}
    ${HOD_NUMBER_FIELDS.map(f=>{
      const empty = d[f.key]===''||d[f.key]===undefined||d[f.key]===null;
      return rowField(f.label, `<input class="num-input${showErrors&&empty?' invalid':''}" style="width:80px;" value="${escapeHtml(d[f.key])}" oninput="updateHodField('${f.key}', this.value, this)" placeholder="#">`);
    }).join('')}
    ${HOD_TOGGLE_FIELDS.slice(5).map(f=>{
      const v=d[f.key]; const invalid = showErrors && v==='';
      return rowField(f.label, `<button class="toggle-btn ${toggleClass(v)}${invalid?' invalid':''}" data-hod="${f.key}" onclick="toggleHodField('${f.key}')">${v||'–'}</button>`);
    }).join('')}
    ${HOD_TEXT_FIELDS.map(f=>{
      const empty = !(d[f.key]||'').trim();
      return rowField(f.label, `<input class="remarks-input${showErrors&&empty?' invalid':''}" style="width:280px;" value="${escapeHtml(d[f.key])}" oninput="updateHodField('${f.key}', this.value, this)" placeholder="Required">`);
    }).join('')}
  </div>
  <div class="card">
    <div class="card-head"><div><h3>Sign-off</h3></div></div>
    <div class="form-toprow">
      <div class="field"><label>Academic Co-ordinator</label><input value="${escapeHtml(d.coordinatorName)}" oninput="updateHodField('coordinatorName', this.value, this)" class="${showErrors && !(d.coordinatorName||'').trim() ? 'invalid':''}"></div>
      <div></div><div></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="cancelHodDraft()">Cancel</button>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" onclick="resetHodDraftForm()">Reset entries</button>
        <button class="btn btn-primary" onclick="submitHodDraft()">${d.editingId ? 'Save changes' : 'Save & generate report'}</button>
      </div>
    </div>
  </div>`;
}

/* =========================================================================
   PRINT PREVIEW
   ========================================================================= */
function openPreview(id, backTo){
  state.previewId = id; state.previewKind = 'submission'; state.previewBack = backTo; state.view='preview'; render();
}
function openHodPreview(id, backTo){
  state.previewId = id; state.previewKind = 'hod'; state.previewBack = backTo; state.view='preview'; render();
}
function closePreview(){
  const backTo = state.previewBack;
  state.previewId = null; state.previewKind = 'submission'; state.view=null;
  if(backTo==='admin'){ /* stay in admin */ }
  else if(backTo==='coordinator'){ state.coordinatorView = 'reports'; }
  else { state.memberView = 'submissions'; }
  render();
}

// Override render to check preview mode
const _origRender = render;
render = function(){
  if(state.previewId){
    const page = state.previewKind==='hod' ? renderHodPreviewPage() : renderPreviewPage();
    document.getElementById('root').innerHTML = page + (state.toast?`<div class="toast">${escapeHtml(state.toast)}</div>`:'') + (state.modal?renderModal():'');
    return;
  }
  _origRender();
};

/* Every render() call rebuilds the whole #root innerHTML, which would
   otherwise reset scroll position on every click — most noticeably the
   horizontal scroll on the wide monitoring-entries table. Wrap render()
   one more time to snapshot and restore scroll offsets around it. */
const _renderBeforeScrollFix = render;
render = function(){
  const scrollWrap = document.querySelector('.scroll-table-wrap');
  const wrapLeft = scrollWrap ? scrollWrap.scrollLeft : 0;
  const wrapTop = scrollWrap ? scrollWrap.scrollTop : 0;
  const contentEl = document.querySelector('.content');
  const contentTop = contentEl ? contentEl.scrollTop : 0;
  const winX = window.scrollX, winY = window.scrollY;
  const activeId = document.activeElement && document.activeElement.id;

  _renderBeforeScrollFix();

  const newWrap = document.querySelector('.scroll-table-wrap');
  if(newWrap){ newWrap.scrollLeft = wrapLeft; newWrap.scrollTop = wrapTop; }
  const newContentEl = document.querySelector('.content');
  if(newContentEl) newContentEl.scrollTop = contentTop;
  window.scrollTo(winX, winY);
  if(activeId){ const el = document.getElementById(activeId); if(el) el.focus(); }
};

  const [y,m,d] = iso.split('-');
